
module_name: Omni Swashplateless

parameters:
    #add by jay
    - group: Omni Swashplateless
      definitions:
        OMNI_UA:
            description:
                short: Module Param - Average velocity for swashplatess mechanism
                long: |
                    DC component u_a, i.e. baseline setpoint velocity (unit: RPM)
            type: float
            default: 0
            min: 0.0
            max: 1.0
        OMNI_US:
            description:
                short: Module Param - Sinusoidal velocity amplitude
                long: |
                    Amplitude u_s of the sinusoidal modulation added to the baseline velocity (unit: RPM)
            type: float
            default: 0.0
            min: 0.0
            max: 1.0
        OMNI_PHASE:
            description:
                short: Module Param - Sinusoidal phase offset
                long: |
                      Phase shift \alpha for the sinusoidal term sin(φ – \alpha) (unit: deg)
            type: float
            default: 0.0
            min: 0.0
            max: 360.0
        MOTOR_DELAY_BIAS:
            description:
                short: Module Param - Propeller lag angle (unit:deg)
            type: float
            default: 0.0
            min: 0.0
            max: 360.0
        # add by jayjie
        OMNI_RC_TEST_IDX:
            description:
                short: RC manual test actuator index
                long: |
                    Selects which actuator receives the RC manual simulation output in grouped-output mode.
                    The other actuators are held at zero.
            type: int32
            default: 0
            min: 0
            max: 3
        OMNI_RC_TST_MODE:
            description:
                short: RC manual test mode
                long: |
                    Selects the RC manual actuator test mode.
                    0: single actuator test, only OMNI_RC_TEST_IDX receives output.
                    1: all actuator test, all four actuators receive output.
            type: int32
            default: 0
            min: 0
            max: 1
        # end
    #end add by jay
