module_name: Omni Uart IO
# serial_config:
#     - command: omni_uart_interface start -d ${SERIAL_DEV}
#       port_config_param:
#         name: OMNI_UART_IO_CFG
#         group: Omni Uart IO

parameters:
    - group: Omni Uart IO
      definitions:
        OMNI_UART_BAUD:
            description:
                short: The OMNI driver's baud rate
                long: |
                    The baud rate (in bits per second) used by the serial port
            type: int32
            reboot_required: true
            default: 921600
        MOTOR_ZERO_POS:
            description:
                short: Module Param - The angle between the positive blade and the y-axis of the body is zero degree position (unit:deg)
                long: |
                      Set it to 0 first and read the angle value as the bias value
            type: int32
            default: 0
            min: 0
            max: 1
        ENCODER_ROT_DIR:
            description:
                short: Module Param - The direction of rotation of the encoder
                long: |
                      clockwise 0 and counterclockwise 1(Reverse the incremental direction of the encoder)
            type: int32
            default: 0
            min: 0
            max: 1
        FRAME_ENABLE:
            description:
                short: Module Param - Enable the frame transmission function
                long: |
                      Enable the frame transmission function 0(disable) 1(enable)
            type: int32
            default: 0
            min: 0
            max: 1

